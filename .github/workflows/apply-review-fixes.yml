name: Apply verified call-state review fixes
on:
  push:
    branches: [fix/mobile-media-and-calling]
    paths: ['.feature-import/fix-review.py', '.github/workflows/apply-review-fixes.yml']
permissions:
  contents: write
concurrency:
  group: veyra-review-fixes
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact locally tested capture-state and camera-flip fixes
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/mobile-media-and-calling
          python .feature-import/fix-review.py
          sha256sum --check --strict MANIFEST.sha256
          npm run check
          npm test
          npm run build
      - name: Commit review fixes on feature branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/mobile-media-and-calling
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/core/calls.js public/core/media.js tests/calls.test.mjs tests/media.test.mjs MANIFEST.sha256
          git commit -m 'fix: refresh capture state after ICE discovery and flip the active camera'
          git push origin HEAD:refs/heads/fix/mobile-media-and-calling
