name: Import verified Veyra source

on:
  push:
    branches: [main]
    paths: ['.bootstrap/ready']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veyra-source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reassemble and verify original source archive
        env:
          EXPECTED_SHA256: 25fac9d62bdd08716983d3e57a3440e821f4e69da2f22165686ba4a90eee8335
        run: |
          set -euo pipefail
          cat .bootstrap/part-*.bin > "$RUNNER_TEMP/veyra-source.tar.xz"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/veyra-source.tar.xz" | sha256sum --check --strict
          python3 - <<'PY'
          import os, pathlib, tarfile
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'veyra-source.tar.xz'
          stage = pathlib.Path(os.environ['RUNNER_TEMP']) / 'veyra-source'
          stage.mkdir()
          with tarfile.open(archive, 'r:xz') as source:
              source.extractall(stage, filter='data')
          PY
          (cd "$RUNNER_TEMP/veyra-source" && sha256sum --check --strict MANIFEST.sha256)
          rsync -a --exclude='.github/' "$RUNNER_TEMP/veyra-source/" ./
      - name: Validate source, tests, and static build
        run: |
          npm run check
          npm test
          npm run build
      - name: Commit complete source without rewriting history
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r -- .bootstrap
          git add --all -- . ':!.github'
          git commit -m 'feat: add complete Veyra Workspace v1.0.0 source'
          git push origin HEAD:main
          printf 'Imported source commit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
